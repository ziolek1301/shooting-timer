name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Stamp the commit id so every deploy ships a changed sw.js and the app offers a reload.
      - name: Build site
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest icon-*.png _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html _site/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
